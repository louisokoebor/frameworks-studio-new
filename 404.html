  <style>
/* =========================
   MOBILE SITE MANAGEMENT
========================= */
.site-management-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  cursor: pointer;
}
.dropdown-mobile {
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: max-height 0.3s ease, opacity 0.25s ease, margin-top 0.3s ease;
  margin-top: 0;
}
.dropdown-arrow-mobile {
  transition: transform 0.25s ease;
  transform-origin: center;
}
/* =========================
   DESKTOP DROPDOWN
========================= */
.dropdown-parent {
  position: relative;
}
.nav-dropdown {
  display: block !important;
  position: absolute;
  top: 100%;
  left: 0;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(8px);
  transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
  z-index: 999;
}
.dropdown-parent::after {
  content: "";
  position: absolute;
  left: 0;
  top: 100%;
  width: 100%;
  height: 16px;
}
.dropdown-arrow {
  transition: transform 0.2s ease;
}
/* =========================
   NAVBAR SCROLL BACKGROUND
========================= */
.nav_component {
  background-color: transparent;
  transition: background-color 0.3s ease;
}
.nav_component.is-scrolled {
  background-color: #FFFDF7;
}
</style>
  <script>
document.addEventListener("DOMContentLoaded", function () {
  /* =========================
     MOBILE SITE MANAGEMENT
  ========================= */
  const mobileToggle = document.querySelector(".site-management-toggle");
  const mobileDropdown = document.querySelector(".dropdown-mobile");
  const mobileArrow = document.querySelector(".dropdown-arrow-mobile");
  if (mobileToggle && mobileDropdown) {
    let isMobileOpen = false;
    function openMobileDropdown() {
      mobileDropdown.style.visibility = "visible";
      mobileDropdown.style.pointerEvents = "auto";
      mobileDropdown.style.opacity = "1";
      mobileDropdown.style.marginTop = "12px";
      mobileDropdown.style.maxHeight = mobileDropdown.scrollHeight + "px";
      if (mobileArrow) {
        mobileArrow.style.transform = "rotate(180deg)";
      }
      isMobileOpen = true;
    }
    function closeMobileDropdown() {
      mobileDropdown.style.maxHeight = "0px";
      mobileDropdown.style.opacity = "0";
      mobileDropdown.style.marginTop = "0px";
      mobileDropdown.style.pointerEvents = "none";
      if (mobileArrow) {
        mobileArrow.style.transform = "rotate(0deg)";
      }
      isMobileOpen = false;
      setTimeout(() => {
        if (!isMobileOpen) {
          mobileDropdown.style.visibility = "hidden";
        }
      }, 300);
    }
    mobileToggle.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (isMobileOpen) {
        closeMobileDropdown();
      } else {
        openMobileDropdown();
      }
    });
    window.addEventListener("resize", function () {
      if (window.innerWidth > 991) {
        mobileDropdown.style.maxHeight = "";
        mobileDropdown.style.opacity = "";
        mobileDropdown.style.visibility = "";
        mobileDropdown.style.pointerEvents = "";
        mobileDropdown.style.marginTop = "";
        if (mobileArrow) mobileArrow.style.transform = "";
        isMobileOpen = false;
        return;
      }
      if (isMobileOpen) {
        mobileDropdown.style.maxHeight = mobileDropdown.scrollHeight + "px";
      }
    });
  }
  /* =========================
     DESKTOP DROPDOWN
  ========================= */
  const desktopParent = document.querySelector(".dropdown-parent");
  const desktopDropdown = document.querySelector(".nav-dropdown");
  const desktopArrow = document.querySelector(".dropdown-arrow");
  if (desktopParent && desktopDropdown) {
    let closeTimeout;
    function openDesktopDropdown() {
      clearTimeout(closeTimeout);
      desktopDropdown.style.opacity = "1";
      desktopDropdown.style.visibility = "visible";
      desktopDropdown.style.pointerEvents = "auto";
      desktopDropdown.style.transform = "translateY(0)";
      if (desktopArrow) desktopArrow.style.transform = "rotate(180deg)";
    }
    function closeDesktopDropdown() {
      clearTimeout(closeTimeout);
      closeTimeout = setTimeout(() => {
        desktopDropdown.style.opacity = "0";
        desktopDropdown.style.visibility = "hidden";
        desktopDropdown.style.pointerEvents = "none";
        desktopDropdown.style.transform = "translateY(8px)";
        if (desktopArrow) desktopArrow.style.transform = "rotate(0deg)";
      }, 220);
    }
    desktopParent.addEventListener("mouseenter", openDesktopDropdown);
    desktopParent.addEventListener("mouseleave", closeDesktopDropdown);
    desktopDropdown.addEventListener("mouseenter", openDesktopDropdown);
    desktopDropdown.addEventListener("mouseleave", closeDesktopDropdown);
  }
  /* =========================
     NAVBAR SCROLL BACKGROUND
  ========================= */
  const navbars = document.querySelectorAll(".nav_component");
  function updateNavbars() {
    const trigger = window.innerHeight * 0.02;
    const shouldBeScrolled = window.scrollY > trigger;
    navbars.forEach((navbar) => {
      navbar.classList.toggle("is-scrolled", shouldBeScrolled);
    });
  }
  if (navbars.length) {
    updateNavbars();
    window.addEventListener("scroll", updateNavbars);
    window.addEventListener("resize", updateNavbars);
  }
});
</script>
